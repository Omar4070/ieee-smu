<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="The board's tasks, events, meetings and team." />
    <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1c2e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- on a phone's home screen: name, icon, full screen (public/manifest.webmanifest) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IEEE Board" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>IEEE SMU chapter board</title>
    <script>
      // Theme before first paint: the visitor's choice, else the system setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem('board-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="font-family: sans-serif; padding: 24px">The board app needs JavaScript. Turn it on, or use another browser.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
