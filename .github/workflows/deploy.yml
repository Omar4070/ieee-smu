# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main, every night (so past events move to the
# archive on their own), and on demand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; later runs wait their turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            board/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # e.g. https://your-name.github.io and /repository-name
          # (or your custom domain and "/"), provided by GitHub Pages.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # The board app (board/) is published with the site, at /board/. With the two repository
      # variables below set (Settings → Secrets and variables → Actions → Variables) it connects
      # to Supabase; without them it is published as a demo on sample data.
      - name: Build the board app into the site
        working-directory: board
        run: npm ci && npm run build
        env:
          BOARD_OUT_DIR: ../dist/board
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      # Free Supabase projects pause after a week without activity (school holidays). One small
      # request a night should keep the board's database awake. Skipped until it is configured.
      - name: Keep the board's database awake
        if: ${{ vars.SUPABASE_URL != '' }}
        run: >-
          curl -s -o /dev/null -w "Supabase answered %{http_code}"
          "$SUPABASE_URL/rest/v1/events?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" || true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Check internal links
        run: npm run check:links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
